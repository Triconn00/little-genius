<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Little Genius</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF4D6;--ink:#1F2A44;--card:#fff;--sun:#FFC93C;--leaf:#2FB37A;--coral:#FF6B5B;--sky:#4DB8FF;--grape:#8B6BFF;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;font-weight:500;overflow-x:hidden}
#wrap{max-width:900px;margin:0 auto;padding:12px 16px 28px;min-height:100%}

h1{font-size:clamp(2.2rem,8vw,3.6rem);font-weight:800;margin:6px 0 14px;text-align:center}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.big{border-radius:28px;padding:18px 8px;font-size:1.5rem;font-weight:800;color:#1F2A44;box-shadow:0 6px 0 rgba(0,0,0,.18);display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .1s}

.pic{font-size:clamp(6rem,26vw,11rem);line-height:1.1;background:none;display:block;margin:0 auto}

.row{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:14px}

.pop{animation:pop .35s}

.msg{font-size:2.2rem;font-weight:800;min-height:3rem;text-align:center;margin-top:12px}

.opt.num{font-size:3.6rem}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
button:focus-visible{outline:4px solid var(--grape);outline-offset:3px}
.cert{background:#fff;color:#1F2A44;border:8px double #FFC93C;border-radius:24px;text-align:center;padding:20px;margin:10px auto;max-width:560px}
.prow{background:var(--card);border-radius:18px;padding:12px 16px;margin:10px 0;font-size:1.2rem}
.meter{height:12px;border-radius:6px;background:rgba(127,127,127,.25);overflow:hidden;margin:6px 0}
.meter i{display:block;height:100%;background:var(--leaf)}
.lv{font-size:1.1rem;padding:8px 14px;border-radius:999px;background:var(--card);color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.15);margin:4px}
.lv.on{background:var(--sun);color:#1F2A44}
@media print{header,.row{display:none}}
:root{--sky1:#BFE8FF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky1:#2B3A78}}
#sky{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0;background:linear-gradient(var(--sky1),var(--bg) 55%)}
.cloud{position:absolute;left:0;font-size:5rem;opacity:.85;animation:drift 60s linear infinite}
@keyframes drift{from{transform:translateX(-25vw)}to{transform:translateX(125vw)}}
#wrap{position:relative;z-index:1}
#mascot{position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));font-size:2.8rem;z-index:2;pointer-events:none;filter:drop-shadow(0 6px 4px rgba(0,0,0,.3));animation:float 3s ease-in-out infinite}
#mascot.talk{animation:talk .28s ease-in-out infinite alternate}
@keyframes talk{to{transform:translateY(-8px) rotate(8deg) scale(1.1)}}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes land{from{transform:translateY(-70px) scale(.5);opacity:0}}
@keyframes wiggle{25%{transform:rotate(-12deg) scale(1.18)}75%{transform:rotate(12deg) scale(1.18)}}
.pic{filter:drop-shadow(0 16px 10px rgba(0,0,0,.28));animation:land .7s cubic-bezier(.2,1.6,.4,1) both,float 3.2s ease-in-out .7s infinite}
.pic.pop{animation:wiggle .5s}
.letter{animation:land .7s cubic-bezier(.2,1.6,.4,1) both;text-shadow:0 6px 0 rgba(0,0,0,.15)}
.objs button.pop{animation:wiggle .4s}
.conf{position:fixed;font-size:1.8rem;pointer-events:none;z-index:9;animation:burst 1.3s ease-out forwards}
@keyframes burst{to{transform:translate(var(--x),calc(var(--y) + 180px)) rotate(var(--r));opacity:0}}
#start{position:fixed;inset:0;z-index:20;width:100%;background:var(--sun);color:#1F2A44;font-size:2.4rem;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
:root{--glass:rgba(255,255,255,.55)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--glass:rgba(42,53,96,.6)}#sky::after{filter:brightness(.4)}}
#sky{background:radial-gradient(circle at 88% 6%,rgba(255,240,150,.95) 0,rgba(255,236,130,.4) 9%,transparent 22%),linear-gradient(var(--sky1),var(--bg) 60%)}
#sky::after{content:"";position:absolute;left:-10%;right:-10%;bottom:-6%;height:26%;background:radial-gradient(ellipse at 28% 100%,#5BC97F 0 55%,transparent 56%),radial-gradient(ellipse at 75% 100%,#3FAE6A 0 50%,transparent 51%)}
#sky i{position:absolute;bottom:-60px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,rgba(255,255,255,.12) 60%,rgba(255,255,255,.45));box-shadow:inset 0 0 8px rgba(255,255,255,.8);animation:rise2 linear infinite}
@keyframes rise2{to{transform:translate(30px,-115vh)}}
@keyframes pop-in{from{transform:translateY(60px) scale(.7);opacity:0}}
@keyframes glow{50%{transform:scale(1.12);opacity:.7}}
.pill{background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.7);box-shadow:0 8px 20px rgba(0,0,0,.15)}
h1{background:linear-gradient(90deg,#FF6B5B,#FFC93C,#2FB37A,#4DB8FF);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 rgba(0,0,0,.18))}
.big{background-image:linear-gradient(180deg,rgba(255,255,255,.6),rgba(255,255,255,0) 48%,rgba(0,0,0,.14))!important;border-radius:36px;box-shadow:inset 0 3px 0 rgba(255,255,255,.75),inset 0 -7px 0 rgba(0,0,0,.14),0 10px 0 rgba(0,0,0,.18),0 20px 26px rgba(0,0,0,.22);animation:pop-in .7s cubic-bezier(.2,1.5,.4,1) both}
.big:active{transform:translateY(7px);box-shadow:inset 0 3px 0 rgba(255,255,255,.75),inset 0 -7px 0 rgba(0,0,0,.14),0 3px 0 rgba(0,0,0,.18),0 6px 10px rgba(0,0,0,.2)}
.grid>.big:nth-child(2){animation-delay:.08s}.grid>.big:nth-child(3){animation-delay:.16s}.grid>.big:nth-child(4){animation-delay:.24s}.grid>.big:nth-child(5){animation-delay:.32s}
.big .e{filter:drop-shadow(0 8px 5px rgba(0,0,0,.3));animation:float 3s ease-in-out infinite}
.grid>.big:nth-child(even) .e{animation-delay:-1.5s}
.tile,.opt{border-radius:26px;box-shadow:inset 0 3px 0 rgba(255,255,255,.8),0 7px 0 rgba(0,0,0,.14),0 14px 20px rgba(0,0,0,.14)}
.opt{animation:pop-in .5s cubic-bezier(.2,1.5,.4,1) both}
.opt:nth-child(2){animation-delay:.07s}.opt:nth-child(3){animation-delay:.14s}.opt:nth-child(4){animation-delay:.21s}
.nav{background-image:linear-gradient(rgba(255,255,255,.55),transparent 50%,rgba(0,0,0,.12));box-shadow:inset 0 3px 0 rgba(255,255,255,.6),0 7px 0 rgba(0,0,0,.2),0 14px 18px rgba(0,0,0,.2)}
.pic{position:relative;isolation:isolate}
.pic::before{content:"";position:absolute;inset:4%;z-index:-1;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.95),rgba(255,255,255,0) 68%);animation:glow 3s ease-in-out infinite}
.p{position:absolute;left:0;pointer-events:none;will-change:transform;opacity:.92;text-shadow:0 0 10px rgba(255,255,255,.5)}
.p.fall{animation:fall linear infinite}
.p.rise{animation:rise ease-in-out infinite}
.p.fly{animation:fly ease-in-out infinite;left:0!important}
.p.walk{animation:walk linear infinite;left:0!important;top:auto!important;bottom:-2px}
.p.sway{animation:sway ease-in-out infinite;transform-origin:50% 100%;top:auto!important;bottom:-4px}
.p.twinkle{animation:twinkle ease-in-out infinite}
.p.spin{animation:spin linear infinite}
@keyframes fall{from{transform:translate(0,-10vh) rotate(0)}50%{transform:translate(40px,50vh) rotate(200deg)}to{transform:translate(-30px,110vh) rotate(380deg)}}
@keyframes rise{from{transform:translate(0,105vh)}50%{transform:translate(30px,50vh)}to{transform:translate(-20px,-15vh)}}
@keyframes fly{0%{transform:translate(-15vw,0)}25%{transform:translate(20vw,-36px) rotate(-6deg)}50%{transform:translate(55vw,10px) rotate(6deg)}75%{transform:translate(85vw,-30px) rotate(-4deg)}to{transform:translate(118vw,0)}}
@keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes walk{from{transform:translateX(-20vw)}to{transform:translateX(120vw)}}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1.25)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shift{50%{background-position:100% 50%}}
body[data-env=abc] #sky{background:radial-gradient(circle at 88% 6%,rgba(255,240,150,.95) 0,transparent 22%),linear-gradient(#8ED8FF,#FFF3C2 70%)}
body[data-env=num]{--ink:#fff;--card:#2B3470;--glass:rgba(30,36,90,.6)}
body[data-env=num] #sky{background:radial-gradient(circle at 20% 15%,rgba(139,107,255,.5),transparent 40%),radial-gradient(circle at 80% 70%,rgba(77,184,255,.3),transparent 45%),linear-gradient(#0E1233,#2B2F7A 60%,#5B3FA8)}
body[data-env=num] #sky::after,body[data-env=num] .cloud,body[data-env=num] #sky>i{display:none}
body[data-env=animals] #sky{background:radial-gradient(circle at 88% 6%,rgba(255,240,150,.95) 0,transparent 22%),linear-gradient(#87D6FF,#E6F8C8 60%,#8FD66B)}
body[data-env=think] #sky{background:linear-gradient(135deg,#FFD6F5,#C9B8FF,#9ED8FF,#FFE9A8);background-size:300% 300%;animation:shift 14s ease infinite}
body[data-env=abc],body[data-env=animals],body[data-env=colours],body[data-env=think]{--ink:#1F2A44;--card:#fff}
body[data-env=think] #sky::after,body[data-env=think] .cloud{display:none}
body[data-env=colours] #sky{background:linear-gradient(#9BE0FF,#FFFFFF 75%)}
body[data-env=colours] #sky::before{content:"";position:absolute;left:50%;bottom:-38vh;width:130vw;height:130vw;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,transparent 52%,#FF6B5B 52% 56%,#FFA94D 56% 60%,#FFE14D 60% 64%,#5BD67A 64% 68%,#4DB8FF 68% 72%,#8B6BFF 72% 76%,transparent 76%);opacity:.85}
@media (prefers-reduced-motion:reduce){#env{display:none}}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.nav:disabled{opacity:.3;filter:grayscale(1);pointer-events:none}
.mic{background:var(--coral)}
.mic.hot{background:#FF3B30;animation:pulse .8s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.15)}}
</style>
</head>
<body>
<div id="sky" aria-hidden="true"><div id="env"></div><span class="cloud" style="top:8%;animation-duration:70s">☁️</span><span class="cloud" style="top:28%;animation-duration:95s;animation-delay:-40s;font-size:3.5rem">☁️</span><span class="cloud" style="top:58%;animation-duration:80s;animation-delay:-15s;font-size:4rem">☁️</span></div>
<div id="mascot" aria-hidden="true">🦉</div>
<button id="start"><span style="font-size:6rem">🔊</span>Tap to start</button>
<div id="wrap">
<header><div style="display:flex;gap:8px"><button class="pill" id="home" aria-label="Home">🏠</button><button class="pill" id="parent" aria-label="Parents: press and hold">👪</button></div><div class="pill" id="stars" role="status">⭐ 0</div></header>
<main id="app"></main>
</div>
<script>
const $=s=>document.querySelector(s);
const app=$('#app'),mascot=$('#mascot');
const LV=[{n:'Beginner',age:'2–3',max:10,opt:2},{n:'Nursery 1',age:'3–4',max:20,opt:3},{n:'Nursery 2',age:'4–5',max:50,opt:3},{n:'Nursery 3',age:'5–6',max:100,opt:3}];
const BADGES=[[10,'🥉','Bronze Star'],[25,'🥈','Silver Star'],[50,'🥇','Gold Star'],[100,'🏆','Super Genius']];
let S={stars:0,level:null,diff:0,run:0,miss:0,st:{},done:{},badges:[]};
try{Object.assign(S,JSON.parse(localStorage.getItem('lg2')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('lg2',JSON.stringify(S))}catch(e){}};
const showStars=()=>{$('#stars').textContent='⭐ '+S.stars};
showStars();
const mark=k=>{if(!S.done[k]){S.done[k]=1;save()}};
const nopt=()=>Math.min(4,LV[S.level].opt+S.diff);
/* progress + adaptive difficulty: 3 right in a row = harder, 2 wrong in a row = easier */
function rec(sec,ok){
  const t=S.st[sec]||(S.st[sec]={r:0,w:0});
  if(ok){t.r++;S.miss=0;if(++S.run>=3&&S.diff<2){S.diff++;S.run=0}}
  else{t.w++;S.run=0;if(++S.miss>=2&&S.diff>0){S.diff--;S.miss=0}}
  save();
}
function bump(){S.stars++;showStars();const b=BADGES.find(x=>x[0]===S.stars);if(b)S.badges.push(b[0]);save();return b}

/* ---- Voice teacher (prefers Nigerian English, falls back to British) ---- */
let voice=null;
function pickVoice(){
  const v=speechSynthesis.getVoices();
  voice=v.find(x=>/en[-_]NG/i.test(x.lang))||v.find(x=>/en[-_]GB/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null;
}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
let sayT,AC;
/* Sound effects (work even when the phone has no speaking voice) */
function tone(f,t=0,d=.18,type='sine'){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime+t;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(.25,n+.02);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+d+.05)}catch(e){}}
const beep=()=>tone(660,0,.1);
const winSound=()=>[523,659,784,1047].forEach((f,i)=>tone(f,i*.1,.2));
const oops=()=>{tone(300,0,.18,'triangle');tone(220,.15,.25,'triangle')};
document.addEventListener('pointerdown',e=>{if(e.target.closest('button'))beep()});
let sayId=0;
function sayThen(cb,...lines){clearTimeout(sayT);sayT=setTimeout(()=>say0(cb,lines),120)}
function say(...lines){sayThen(null,...lines)}
function hush(){clearTimeout(sayT);sayId++;try{speechSynthesis.cancel()}catch(e){}}
function say0(cb,lines){
  const id=++sayId;let called=false;
  const go=()=>{if(!called&&cb&&id===sayId){called=true;cb()}};
  if(!('speechSynthesis' in window)){go();return}
  speechSynthesis.cancel();
  setTimeout(go,lines.join(' ').length*130+3000); /* safety net if the browser never fires "end" */
  lines.forEach((t,k)=>{
    const u=new SpeechSynthesisUtterance(t),last=k===lines.length-1;
    u.lang=voice?voice.lang:'en-GB';if(voice)u.voice=voice;
    u.rate=.8;u.pitch=1.15;u.onstart=()=>mascot.classList.add('talk');
    u.onend=()=>{if(!speechSynthesis.pending)mascot.classList.remove('talk');if(last)go()};
    u.onerror=()=>{if(!speechSynthesis.pending)mascot.classList.remove('talk')};
    speechSynthesis.speak(u);
  });
}

/* ---- "Say it" gate: child must say the word before Back / Play / Next work ---- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let R=null,micOK=false,permDone=false,rlang='en-NG';
function stopListen(){if(R){R.onresult=R.onerror=R.onend=R.onaudiostart=null;try{R.abort()}catch(e){}R=null}}
const norm=t=>t.toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
function lev(a,b){const d=Array.from({length:a.length+1},(_,i)=>[i,...Array(b.length).fill(0)]);for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}
const ONES=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'],TENS=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
const numWords=n=>n===100?'one hundred':n<20?ONES[n]:TENS[Math.floor(n/10)]+(n%10?' '+ONES[n%10]:'');
/* accepts the word inside a longer phrase, and is forgiving of small-child pronunciation for longer words */
function matches(alts,targets,strict){
  return alts.some(a=>{const h=norm(a),hc=h.replace(/ /g,'');
    return targets.some(t=>{const tn=norm(t),tc=tn.replace(/ /g,'');
      if(!tc)return false;
      if((' '+h+' ').includes(' '+tn+' ')||hc===tc)return true;
      if(strict||tc.length<4)return false;
      const tol=tc.length>=7?2:1;
      return lev(hc,tc)<=tol||h.split(' ').some(w=>w.length>=4&&lev(w,tc)<=tol)})})}
function gate({word,targets,strict,hint=[]}){
  stopListen();
  const msg=$('#gmsg'),mic=$('#mic'),stage=msg.parentNode;
  const lock=on=>['prev','game','next'].forEach(id=>{const b=$('#'+id);if(b){b.disabled=on;b.classList.toggle('locked',on)}});
  if(!SR){lock(false);mic.style.display='none';msg.textContent='🙂 Open in Chrome to practise speaking';return{begin(){}}}
  let tries=0,passed=false,inp=null;
  const kb=!window.isSecureContext; /* opened from a file: browsers block the mic, so use the keyboard's own voice typing */
  const live=()=>document.body.contains(msg);
  lock(true);
  const open=note=>{passed=true;stopListen();mic.classList.remove('hot');lock(false);msg.textContent=note};
  const ok=()=>{const w=['Great job!','Well done!','Perfect!','You said it!'][Math.floor(Math.random()*4)];open('⭐ '+w);confetti();say(w)};
  const skipBtn=(label)=>{if($('#skip'))return;const b=document.createElement('button');b.id='skip';b.className='lv';b.textContent=label||'👪 Grown-up: hold to skip';let h;
    b.onpointerdown=()=>{h=setTimeout(()=>{b.remove();open('👍');say('Okay, let’s go on!')},1500)};
    ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>clearTimeout(h)));stage.appendChild(b)};
  const fail=()=>{tries++;msg.textContent='🙂 Try again';mic.classList.remove('hot');oops();
    const lines=tries===1?['Good try!',`Listen. ${word}.`,`Now you say ${word}.`]
      :tries===2?['Let’s try again.',...hint,`Say ${word}.`]
      :['Let’s say it together.',`${word}.`,`${word}.`,'Your turn!'];
    if(tries>=4)skipBtn();

    sayThen(()=>{if(live()&&!passed){if(kb)inp.value='';else start(true)}},...lines)};
  /* mic unavailable: stay locked, show why, and let a grown-up confirm by holding the button */
  function broken(c,x){
    mic.classList.remove('hot');msg.textContent='🎤 ✖';
    const embedded=location.protocol==='file:'||window.top!==window.self;
    const why=c==='insecure-origin'?'This page was opened from a file, so the browser blocks the microphone. Open it from a web link (https) instead.'
      :c==='audio-capture'?'No microphone was found.'
      :c==='network'?'Speech recognition needs an internet connection.'
      :c==='service-not-allowed'?'This browser blocks speech recognition. Try another browser, or turn on Google voice typing in phone settings.'
      :embedded?'The microphone is blocked in this view. Open the page directly in Chrome and tap Allow.'
      :(/Android/i.test(navigator.userAgent)?'Chrome has the microphone turned off for this page. Tap the ⓘ icon at the left of the web address, then Permissions, then Microphone, then Allow. If you do not see it, open phone Settings, then Apps, then Chrome, then Permissions, then Microphone, and choose Allow while using the app. Then reload this page.':'Click the icon at the left of the web address, set Microphone to Allow, then reload this page.');
    let w=$('#gwhy');if(!w){w=document.createElement('div');w.id='gwhy';w.style.cssText='font-size:1rem;max-width:420px;margin:6px auto;opacity:.9';msg.after(w)}
    w.textContent=why+' ('+c+(x?', '+x:'')+')';
    say('I can’t hear you. Ask a grown-up.');
    skipBtn('👪 Grown-up: hold to confirm');
  }
  function start(auto){
    if(!live()||passed)return;
    stopListen();
    if(!window.isSecureContext){broken('insecure-origin');return}
    if(auto&&!micOK){msg.textContent='👆 Tap 🎤';mic.classList.add('hot');say('Tap the microphone and say it!');return}
    if(!auto)hush();
    const w0=$('#gwhy');if(w0)w0.remove();
    /* ask for mic permission explicitly first: some browsers never show the prompt for speech recognition alone */
    if(!micOK&&!permDone&&navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){
      msg.textContent='🎤 …';
      navigator.mediaDevices.getUserMedia({audio:true}).then(st=>{st.getTracks().forEach(t=>t.stop());permDone=true;setTimeout(()=>{if(live()&&!passed)start(false)},350)})
        .catch(e=>broken(e&&e.name==='NotFoundError'?'audio-capture':'not-allowed',e&&e.name));
      return;
    }
    const r=new SR();R=r;r.lang=rlang;r.maxAlternatives=5;r.interimResults=false;r.continuous=false;
    let got=false;
    r.onaudiostart=()=>{micOK=true};
    r.onresult=e=>{got=true;const alts=[...e.results[0]].map(x=>x.transcript);mic.classList.remove('hot');matches(alts,targets,strict)?ok():fail()};
    r.onerror=e=>{const c=e.error;
      if((c==='language-not-supported'||c==='network')&&rlang!=='en-GB'){rlang='en-GB';start(false);return}
      if(['not-allowed','service-not-allowed','audio-capture','network'].includes(c))broken(c)};
    r.onend=()=>{mic.classList.remove('hot');if(!got&&live()&&!passed&&msg.textContent.startsWith('🎤'))msg.textContent='👆 Tap 🎤'};
    msg.textContent='🎤 Listening…';mic.classList.add('hot');
    try{r.start()}catch(e){}
  }
  if(kb){
    mic.style.display='none';
    msg.textContent='🎤 Tap the box, press 🎤 on your keyboard and say it';
    inp=document.createElement('input');inp.type='text';inp.autocomplete='off';inp.autocapitalize='off';inp.spellcheck=false;inp.setAttribute('autocorrect','off');inp.setAttribute('aria-label','Say the word');inp.placeholder='Say it here 🎤';
    inp.style.cssText='font:inherit;font-size:1.6rem;padding:10px 16px;border-radius:20px;border:4px solid var(--grape);width:min(340px,90%);text-align:center;background:#fff;color:#1F2A44;margin-top:6px';
    msg.after(inp);
    let t;const check=()=>{clearTimeout(t);if(passed||!inp.value.trim())return;t=setTimeout(()=>{if(!live()||passed)return;matches([inp.value],targets,strict)?(inp.disabled=true,inp.blur(),ok()):fail()},1300)};
    inp.addEventListener('input',check);
    return{begin(){}};
  }
  mic.onclick=()=>start(false);
  return{begin:()=>start(true)};
}

const pick=(arr,n,not)=>{const a=arr.filter((_,i)=>i!==not).sort(()=>Math.random()-.5).slice(0,n);return a};

/* ---- Screens ---- */
function home(){stopListen();

function menu(kind,labels,go){stopListen();

function nav(prev,next,game){
  return `<div class="msg" id="gmsg" style="font-size:1.6rem;min-height:2.4rem;margin-top:6px"></div><div class="row" style="margin-top:6px"><button class="nav mic" id="mic" aria-label="Say it">🎤</button></div><div class="row"><button class="nav" id="prev" aria-label="Back">⬅️</button><button class="nav play" id="game" aria-label="Play">🎮</button><button class="nav" id="next" aria-label="Next">➡️</button></div>`;
}
function wireNav(prev,next,game){
  $('#prev').onclick=prev;$('#next').onclick=next;$('#game').onclick=game;
}

function letter(i){setEnv('abc');
  const [L,w,e,s]=LET[i];
  app.innerHTML=`<div class="stage"><p class="letter">${L}${L.toLowerCase()}</p><button class="pic" id="pic">${e}</button><div class="word">${L} for ${w}</div>${nav()}</div>`;
  mark('L'+i);const g=gate({word:w,targets:[w],hint:[`${L} says ${s}.`,`${L} for ${w}.`]});
  $('#pic').onclick=()=>{$('#pic').classList.remove('pop');void $('#pic').offsetWidth;$('#pic').classList.add('pop');sayThen(g.begin,w)};
  wireNav(()=>letter((i+25)%26),()=>letter((i+1)%26),()=>quiz({
    sec:'ABC',say:`Touch the picture that starts with ${L}.`,
    options:shuffle([{l:e,ok:1},...pick(LET,nopt()-1,i).map(x=>({l:x[2]}))]),
    win:()=>letter((i+1)%26)}));
  sayThen(g.begin,L+'.',`${L} says ${s}.`,`${L} for ${w}.`,`Now you say ${w}!`);
}
function number(n){setEnv('num');
  app.innerHTML=`<div class="stage"><p class="letter" style="color:var(--sky)">${n}</p><div class="objs" id="objs" style="font-size:${n>30?'.5':n>20?'.8':'1'}rem">${Array.from({length:n},()=>'<button>🥭</button>').join('')}</div><div class="word" id="cnt">&nbsp;</div>${nav()}</div>`;
  mark('N'+n);let c=0;const g=gate({word:String(n),targets:[String(n),numWords(n)],strict:1});
  app.querySelectorAll('#objs button').forEach(b=>b.onclick=()=>{if(b.dataset.d)return;b.dataset.d=1;c++;b.classList.add('pop');$('#cnt').textContent=c;c===n?sayThen(g.begin,String(c),`You counted ${n}! Now you say ${n}!`):say(String(c))});
  const mx=LV[S.level].max;
  wireNav(()=>number(n===1?mx:n-1),()=>number(n===mx?1:n+1),()=>{
    const wrong=pick(Array.from({length:mx},(_,i)=>i+1),nopt()-1,n-1);
    quiz({sec:'123',say:'How many mangoes? Touch the right number.',top:`<div class="objs" style="font-size:${n>30?'1.1':n>20?'1.6':'2.6'}rem">${'🥭'.repeat(n)}</div>`,num:1,
      options:shuffle([{l:n,ok:1},...wrong.map(x=>({l:x}))]),win:()=>number(n===mx?1:n+1)});
  });
  say(`${n}.`,'Touch each mango to count. Then say the number!');
}
function animal(i){setEnv('animals');
  const [a,e,s]=ANI[i];
  app.innerHTML=`<div class="stage"><button class="pic" id="pic">${e}</button><div class="word">${a}</div>${nav()}</div>`;
  mark('A'+i);const n=ANI.length;const g=gate({word:a,targets:[a],hint:[`The ${a.toLowerCase()} says ${s}.`]});
  $('#pic').onclick=()=>{$('#pic').classList.remove('pop');void $('#pic').offsetWidth;$('#pic').classList.add('pop');sayThen(g.begin,`The ${a.toLowerCase()} says ${s}!`)};
  wireNav(()=>animal((i+n-1)%n),()=>animal((i+1)%n),()=>quiz({
    sec:'Animals',say:`Which animal says ${s}?`,
    options:shuffle([{l:e,ok:1},...pick(ANI,nopt()-1,i).map(x=>({l:x[1]}))]),
    win:()=>animal((i+1)%n)}));
  sayThen(g.begin,`${a}.`,`The ${a.toLowerCase()} says ${s}!`,`Now you say ${a}!`);

function odd(k){setEnv('think');
  const [items,idx]=ODD[k%ODD.length];
  quiz({sec:'Think',say:'Which one does not belong?',options:items.map((l,j)=>({l,ok:j===idx})),win:()=>odd(k+1)});

/* ---- Age level, parent progress, certificate ---- */
function levelPick(){stopListen();
  say('Hello! Ask a grown-up to choose your age.');
  app.innerHTML=`<h1>How old are you?</h1><div class="grid">${LV.map((l,i)=>`<button class="big" style="background:${colors[i]}" data-i="${i}"><span class="e">${['🐣','🐥','🐤','🦉'][i]}</span>${l.age}</button>`).join('')}</div>`;
  app.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{S.level=+b.dataset.i;S.diff=0;save();home()});
}
function parent(){stopListen();
  clearTimeout(winT);if('speechSynthesis' in window)speechSynthesis.cancel();
  if(S.level===null)return levelPick();
  const rows=[['ABC','🔤',26,'L'],['123','🔢',LV[S.level].max,'N'],['Animals','🐘',ANI.length,'A'],['Colours','🎨',COL.length,'C'],['Think','🧩',0,'']];
  const html=rows.map(([n,e,t,p])=>{
    const d=p?Math.min(t,Object.keys(S.done).filter(k=>k[0]===p).length):0,s=S.st[n]||{r:0,w:0},tot=s.r+s.w,acc=tot?Math.round(100*s.r/tot):null;
    return `<div class="prow"><b>${e} ${n}</b>${t?': '+d+' of '+t+' lessons':''}<div class="meter"><i style="width:${acc||0}%"></i></div>${acc===null?'Not played yet':acc+'% correct'+(acc<60&&tot>=5?' (needs practice)':'')}</div>`}).join('');
  const earned=BADGES.filter(b=>S.badges.includes(b[0])).map(b=>b[1]+' '+b[2]).join(', ')||'none yet';
  app.innerHTML=`<h1>Progress</h1>${html}<div class="prow">Challenge: ${['Easy','Medium','Hard'][S.diff]} (adjusts automatically)</div><div class="prow">Age level:<br>${LV.map((l,i)=>`<button class="lv ${i===S.level?'on':''}" data-l="${i}">${l.n} (${l.age})</button>`).join('')}</div><div class="prow">Badges: ${earned}</div><div class="row"><button class="lv on" id="cert">🏆 Certificate${S.stars<10?' (at 10 stars)':''}</button><button class="lv" id="reset">Reset progress</button></div>`;
  app.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{S.level=+b.dataset.l;S.diff=0;save();parent()});
  $('#cert').onclick=()=>{if(S.stars>=10)cert()};
  $('#reset').onclick=function(){if(this.dataset.s){S={stars:0,level:null,diff:0,run:0,miss:0,st:{},done:{},badges:[]};save();showStars();home()}else{this.dataset.s=1;this.textContent='Tap again to erase everything'}};
}

  say('Congratulations! You are a little genius!');
}

function confetti(){
  winSound();
  mascot.textContent='🤩';setTimeout(()=>mascot.textContent='🦉',1800);
  for(let i=0;i<28;i++){
    const s=document.createElement('span');s.className='conf';s.textContent=['⭐','🎉','✨','🎈','💛'][i%5];

    s.style.cssText=`--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d-80}px;--r:${Math.random()*720-360}deg;left:50%;top:45%`;

/* ---- Quiz ---- */
function quiz(q){stopListen();
  app.innerHTML=`<div class="stage">${q.top||''}<div class="msg" id="msg">🎧</div><div class="grid" style="margin-top:12px">${q.options.map((o,i)=>`<button class="opt ${q.num?'num':''}" data-i="${i}">${o.l}</button>`).join('')}</div><div class="row"><button class="nav" id="again" aria-label="Hear again">🔊</button></div></div>`;
  $('#again').onclick=()=>say(q.say);
  let done=false;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(done)return;
    const o=q.options[+b.dataset.i];
    if(o.ok){done=true;rec(q.sec,1);const bd=bump();const w=['Wonderful!','Well done!','Excellent!','You are a star!'][Math.floor(Math.random()*4)];
      $('#msg').textContent=bd?bd[1]+' '+bd[2]:'⭐ '+w;b.classList.add('pop');b.style.background='#BFF0D4';confetti();
      bd?say(w,'You earned the '+bd[2]+'!'):say(w);winT=setTimeout(q.win,bd?3400:1900)}
    else{rec(q.sec,0);oops();b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');$('#msg').textContent='🙂';say('Try again!')}
  });
  say(q.say);
}
