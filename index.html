<style>
:root{--bg:#FFF4D6;--ink:#1F2A44;--card:#fff;--sun:#FFC93C;--leaf:#2FB37A;--coral:#FF6B5B;--sky:#4DB8FF;--grape:#8B6BFF;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1B2340;--ink:#FFF4D6;--card:#2A3560}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;font-weight:500;overflow-x:hidden}
#wrap{max-width:900px;margin:0 auto;padding:12px 16px 28px;min-height:100%}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
.pill{background:var(--card);border-radius:999px;padding:6px 18px;font-size:1.6rem;font-weight:800;box-shadow:0 3px 0 rgba(0,0,0,.15)}
h1{font-size:clamp(2.2rem,8vw,3.6rem);font-weight:800;margin:6px 0 14px;text-align:center}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.big{border-radius:28px;padding:18px 8px;font-size:1.5rem;font-weight:800;color:#1F2A44;box-shadow:0 6px 0 rgba(0,0,0,.18);display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .1s}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.big .e{font-size:3.6rem;line-height:1.1}
.tile{background:var(--card);color:var(--ink);border-radius:20px;padding:10px 0;font-size:2rem;font-weight:800;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.stage{text-align:center}
.letter{font-size:clamp(7rem,32vw,14rem);font-weight:800;line-height:1;color:var(--coral);margin:0}
.pic{font-size:clamp(6rem,26vw,11rem);line-height:1.1;background:none;display:block;margin:0 auto}
.word{font-size:2.4rem;font-weight:800;margin:4px 0 14px}
.row{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:14px}
.nav{width:84px;height:84px;border-radius:50%;font-size:2.4rem;background:var(--sky);box-shadow:0 5px 0 rgba(0,0,0,.18)}
.play{background:var(--leaf);width:auto;border-radius:999px;padding:0 30px}
.objs{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;max-width:520px;margin:0 auto}
.objs button{background:none;font-size:2.6em;padding:2px}
.pop{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.25)}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.msg{font-size:2.2rem;font-weight:800;min-height:3rem;text-align:center;margin-top:12px}
.opt{background:var(--card);color:var(--ink);border-radius:28px;font-size:5rem;padding:10px 0;box-shadow:0 6px 0 rgba(0,0,0,.18);font-weight:800}
.opt.num{font-size:3.6rem}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
button:focus-visible{outline:4px solid var(--grape);outline-offset:3px}
.cert{background:#fff;color:#1F2A44;border:8px double #FFC93C;border-radius:24px;text-align:center;padding:20px;margin:10px auto;max-width:560px}
.prow{background:var(--card);border-radius:18px;padding:12px 16px;margin:10px 0;font-size:1.2rem}
.meter{height:12px;border-radius:6px;background:rgba(127,127,127,.25);overflow:hidden;margin:6px 0}
.meter i{display:block;height:100%;background:var(--leaf)}
.lv{font-size:1.1rem;padding:8px 14px;border-radius:999px;background:var(--card);color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.15);margin:4px}
.lv.on{background:var(--sun);color:#1F2A44}
@media print{header,.row{display:none}}
:root{--sky1:#BFE8FF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky1:#2B3A78}}
#sky{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0;background:linear-gradient(var(--sky1),var(--bg) 55%)}
.cloud{position:absolute;left:0;font-size:5rem;opacity:.85;animation:drift 60s linear infinite}
@keyframes drift{from{transform:translateX(-25vw)}to{transform:translateX(125vw)}}
#wrap{position:relative;z-index:1}
#mascot{position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));font-size:2.8rem;z-index:2;pointer-events:none;filter:drop-shadow(0 6px 4px rgba(0,0,0,.3));animation:float 3s ease-in-out infinite}
#mascot.talk{animation:talk .28s ease-in-out infinite alternate}
@keyframes talk{to{transform:translateY(-8px) rotate(8deg) scale(1.1)}}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes land{from{transform:translateY(-70px) scale(.5);opacity:0}}
@keyframes wiggle{25%{transform:rotate(-12deg) scale(1.18)}75%{transform:rotate(12deg) scale(1.18)}}
.pic{filter:drop-shadow(0 16px 10px rgba(0,0,0,.28));animation:land .7s cubic-bezier(.2,1.6,.4,1) both,float 3.2s ease-in-out .7s infinite}
.pic.pop{animation:wiggle .5s}
.letter{animation:land .7s cubic-bezier(.2,1.6,.4,1) both;text-shadow:0 6px 0 rgba(0,0,0,.15)}
.objs button.pop{animation:wiggle .4s}
.conf{position:fixed;font-size:1.8rem;pointer-events:none;z-index:9;animation:burst 1.3s ease-out forwards}
@keyframes burst{to{transform:translate(var(--x),calc(var(--y) + 180px)) rotate(var(--r));opacity:0}}
:root{--glass:rgba(255,255,255,.55)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--glass:rgba(42,53,96,.6)}#sky::after{filter:brightness(.4)}}
#sky{background:radial-gradient(circle at 88% 6%,rgba(255,240,150,.95) 0,rgba(255,236,130,.4) 9%,transparent 22%),linear-gradient(var(--sky1),var(--bg) 60%)}
#sky::after{content:"";position:absolute;left:-10%;right:-10%;bottom:-6%;height:26%;background:radial-gradient(ellipse at 28% 100%,#5BC97F 0 55%,transparent 56%),radial-gradient(ellipse at 75% 100%,#3FAE6A 0 50%,transparent 51%)}
#sky i{position:absolute;bottom:-60px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,rgba(255,255,255,.12) 60%,rgba(255,255,255,.45));box-shadow:inset 0 0 8px rgba(255,255,255,.8);animation:rise2 linear infinite}
@keyframes rise2{to{transform:translate(30px,-115vh)}}
@keyframes pop-in{from{transform:translateY(60px) scale(.7);opacity:0}}
@keyframes glow{50%{transform:scale(1.12);opacity:.7}}
.pill{background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.7);box-shadow:0 8px 20px rgba(0,0,0,.15)}
h1{background:linear-gradient(90deg,#FF6B5B,#FFC93C,#2FB37A,#4DB8FF);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 rgba(0,0,0,.18))}
.big{background-image:linear-gradient(180deg,rgba(255,255,255,.6),rgba(255,255,255,0) 48%,rgba(0,0,0,.14))!important;border-radius:36px;box-shadow:inset 0 3px 0 rgba(255,255,255,.75),inset 0 -7px 0 rgba(0,0,0,.14),0 10px 0 rgba(0,0,0,.18),0 20px 26px rgba(0,0,0,.22);animation:pop-in .7s cubic-bezier(.2,1.5,.4,1) both}
.big:active{transform:translateY(7px);box-shadow:inset 0 3px 0 rgba(255,255,255,.75),inset 0 -7px 0 rgba(0,0,0,.14),0 3px 0 rgba(0,0,0,.18),0 6px 10px rgba(0,0,0,.2)}

#start .fish{position:absolute;font-size:1.6rem;opacity:0;animation:jump 6s ease-in-out infinite;pointer-events:none}
@keyframes jump{0%,70%,100%{opacity:0;transform:translate(0,0) rotate(0)}74%{opacity:1;transform:translate(0,0) rotate(-50deg)}84%{opacity:1;transform:translate(30px,-60px) rotate(10deg)}94%{opacity:1;transform:translate(60px,0) rotate(70deg)}95%{opacity:0}}
#start .leaf{position:absolute;font-size:1.4rem;top:57%;animation:drift linear infinite;pointer-events:none;opacity:0}
@keyframes drift{0%{opacity:0;transform:translate(0,0) scale(.3)}10%{opacity:1}100%{opacity:0;transform:translate(var(--dx),40vh) scale(1.8) rotate(240deg)}}
#start .hud{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:max(26px,env(safe-area-inset-top)) 20px max(34px,env(safe-area-inset-bottom));pointer-events:none}
#start .logo{width:6.6rem;height:6.6rem;border-radius:30px;box-shadow:0 14px 28px rgba(0,0,0,.35),0 0 0 4px rgba(255,255,255,.35);animation:logofl 3.4s ease-in-out infinite;will-change:transform}
@keyframes logofl{50%{transform:translateY(-10px) rotate(3deg)}}
#start .ttl{font-size:clamp(2rem,8vw,3rem);margin:8px 0 0;text-shadow:0 4px 0 rgba(60,20,90,.55),0 10px 22px rgba(0,0,0,.35);text-align:center;line-height:1.05}
#start .go{pointer-events:auto;position:relative;font:inherit;font-size:2rem;color:#2a1a5e;padding:14px 38px 16px;border-radius:999px;background:linear-gradient(#ffe27a,#ffb42e);
 box-shadow:0 1px 0 #fff inset,0 8px 0 #d17a00,0 14px 0 rgba(0,0,0,.18),0 18px 26px rgba(0,0,0,.35);animation:gopulse 1.8s ease-in-out infinite;overflow:hidden;will-change:transform}
#start .go::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);transform:skewX(-20deg);animation:shine 2.8s ease-in-out infinite}
@keyframes shine{0%,40%{transform:translateX(0) skewX(-20deg)}80%,100%{transform:translateX(480%) skewX(-20deg)}}
@keyframes gopulse{50%{transform:translateY(-6px) scale(1.05)}}
#start:active .go{transform:translateY(6px) scale(.97);animation:none}
#start.leave{transition:opacity .3s;opacity:0}
@media (max-height:560px){#start .logo{width:4.4rem;height:4.4rem}#start .ttl{font-size:1.6rem}}
#start.lite .cl,#start.lite .bird,#start.lite .leaf,#start.lite .fish,#start.lite .ripple,#start.lite .wv:nth-child(n+5),#start.lite .foam.b{display:none}
@media (prefers-reduced-motion:reduce){#start .fish,#start .leaf{display:none}#boot.out{transition:opacity .2s}}

#power{color:#fff;background:#E5484D;display:inline-flex;align-items:center;justify-content:center}
.pwr{width:1.25em;height:1.25em;display:block;vertical-align:-.2em}#off h3 .pwr{display:inline-block;color:#E5484D}
#off button.yes .pwr{display:inline-block}
#off{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;text-align:center;padding:24px;background:rgba(10,12,30,.78);color:#fff}
#off.on{display:flex}
#off .box{background:var(--card);color:var(--ink);border-radius:28px;padding:26px 22px;max-width:360px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.4)}
#off h3{margin:0 0 6px;font-size:2rem}#off p{margin:0 0 18px;font-size:1.2rem}
#off .r{display:flex;gap:12px;justify-content:center}
#off button{font-size:1.5rem;font-weight:800;border-radius:999px;padding:10px 26px;box-shadow:0 4px 0 rgba(0,0,0,.2)}
#off button{white-space:nowrap;padding:10px 20px}#off .yes{background:#E5484D;color:#fff;display:inline-flex;align-items:center;gap:6px}#off .no{background:var(--leaf);color:#fff}
#bye{position:fixed;inset:0;z-index:70;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#0b0d1f;color:#fff;text-align:center;padding:24px;font-size:1.4rem}
#bye.on{display:flex}#bye b{font-size:3rem}
body.pre #wrap,body.pre #sky,body.pre #mascot{visibility:hidden}

body.talking:not(.adultok) button,body.talking:not(.adultok) .tile,body.talking:not(.adultok) .big,body.talking:not(.adultok) .pic,body.talking:not(.adultok) .pill,body.talking:not(.adultok) .nav,body.talking:not(.adultok) .mood{opacity:.7}
#listen{position:fixed;left:50%;top:84px;transform:translateX(-50%);z-index:55;background:#1F2A44;color:#fff;padding:8px 18px;border-radius:999px;font-weight:800;font-size:1.1rem;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap}
#listen.on{opacity:1}

#adult{position:fixed;left:50%;top:78px;transform:translateX(-50%) scale(.92);z-index:65;background:#fff;color:#1F2A44;border:4px solid #FFC93C;border-radius:22px;padding:12px 22px 16px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;min-width:250px;font-weight:800}
#adult.on{opacity:1;transform:translateX(-50%) scale(1)}
#adult b{display:block;font-size:1.35rem}#adult span{display:block;font-size:1.15rem;margin-top:2px}
#adult .bar{display:block;height:6px;border-radius:6px;background:#FFC93C;margin-top:10px;transform-origin:left center}
#adult.on:not(.ok) .bar{animation:adbar 3s linear forwards}
@keyframes adbar{to{transform:scaleX(0)}}
#adult.ok{border-color:#2FB37A}#adult.ok .bar{background:#2FB37A}
.grid.nums{grid-template-columns:repeat(4,1fr);gap:10px}.grid.nums .tile{padding:12px 0;font-size:1.5rem;border-radius:20px}.grid.nums .tile.locked::before{font-size:.8rem;top:2px;right:5px}

#boot .bicon{position:relative;width:7.2rem;height:7.2rem;margin:10px 0 22px;z-index:2;animation:bpop 1.1s cubic-bezier(.2,1.4,.4,1) both}
@keyframes bpop{0%{transform:scale(0) rotate(-200deg);opacity:0}55%{opacity:1}75%{transform:scale(1.18) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
#boot .bicon::before{content:"";position:absolute;inset:-35%;border-radius:50%;background:radial-gradient(circle,rgba(255,220,120,.6),rgba(255,220,120,0) 65%);animation:glowp 2.4s ease-in-out infinite}
@keyframes glowp{50%{transform:scale(1.2);opacity:.6}}
#boot .bicon .ibox{position:absolute;inset:0;border-radius:30px;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.4),0 0 0 4px rgba(255,255,255,.3);animation:ifloat 2.4s ease-in-out 1.1s infinite;will-change:transform}
@keyframes ifloat{0%,100%{transform:translateY(0) rotate(-3deg) scale(1)}50%{transform:translateY(-14px) rotate(3deg) scale(1.05)}}
#boot .bicon .blogo{width:100%;height:100%;border-radius:0;box-shadow:none;animation:none;display:block}
#boot .bicon .shine{position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);transform:skewX(-20deg);animation:ishine 2.6s ease-in-out 1.3s infinite}
@keyframes ishine{0%,45%{transform:translateX(0) skewX(-20deg)}85%,100%{transform:translateX(480%) skewX(-20deg)}}
#boot .bicon .ring{position:absolute;inset:-4px;border-radius:36px;border:3px solid rgba(255,255,255,.55);opacity:0;animation:ringp 2.2s ease-out 1s infinite}
#boot .bicon .ring.r2{animation-delay:2.1s}
@keyframes ringp{0%{transform:scale(.95);opacity:.8}100%{transform:scale(1.8);opacity:0}}
#boot .bicon .orb{position:absolute;left:50%;top:50%;width:1.4rem;height:1.4rem;margin:-.7rem;font-size:1.3rem;line-height:1;animation:orbit 4s linear infinite;will-change:transform}
@keyframes orbit{from{transform:rotate(0) translateX(var(--r)) rotate(0)}to{transform:rotate(360deg) translateX(var(--r)) rotate(-360deg)}}
</style>
</head>

<script>
/* Network time: the greeting follows real internet time, not a wrong phone clock */
(function(){
  const KEY='lg-time-offset';let off=0;
  try{off=+localStorage.getItem(KEY)||0}catch(e){}
  const t=(u,f)=>new Promise((ok,no)=>{const c=new AbortController(),id=setTimeout(()=>{c.abort();no('timeout')},3500);
    fetch(u,{cache:'no-store',signal:c.signal,method:f.method||'GET'}).then(r=>f.read(r)).then(v=>{clearTimeout(id);v?ok(v):no('bad')}).catch(e=>{clearTimeout(id);no(e)})});
  const sources=[
    ()=>location.protocol.startsWith('http')?t(location.origin+'/',{method:'HEAD',read:r=>{const d=r.headers.get('date');return d?Date.parse(d):0}}):Promise.reject('nohttp'),
    ()=>t('https://worldtimeapi.org/api/timezone/Etc/UTC',{read:r=>r.json().then(j=>j.unixtime?j.unixtime*1000:0)}),
    ()=>t('https://timeapi.io/api/Time/current/zone?timeZone=UTC',{read:r=>r.json().then(j=>j.dateTime?Date.parse(j.dateTime+'Z'):0)})
  ];
  const any=ps=>new Promise((ok,no)=>{let n=ps.length;ps.forEach(p=>p.then(ok,()=>{if(--n===0)no()}))});
  function sync(){
    const t0=Date.now();
    return any(sources.map(f=>f())).then(ms=>{const rtt=Date.now()-t0;off=ms+rtt/2-Date.now();try{localStorage.setItem(KEY,off)}catch(e){};window.__netTime=true}).catch(()=>{});
  }
  window.netNow=()=>new Date(Date.now()+off);
  /* morning 5-11, afternoon 12-4pm, evening 5-8pm, night 9pm-4am */
  window.dayPart=()=>{const h=netNow().getHours();return h>=5&&h<12?'morning':h>=12&&h<17?'afternoon':h>=17&&h<21?'evening':'night'};
  window.greetWord=()=>({morning:'Good morning',afternoon:'Good afternoon',evening:'Good evening',night:'Good night'})[dayPart()];
  window.greetIcon=()=>({morning:'🌅',afternoon:'☀️',evening:'🌇',night:'🌙'})[dayPart()];
  window.partWord=()=>({morning:'this morning',afternoon:'this afternoon',evening:'this evening',night:'tonight'})[dayPart()];
  window.__timeReady=sync();
  addEventListener('online',sync);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});
  setInterval(sync,30*60*1000);
})();
</script>
<script>
const $=s=>document.querySelector(s);
const app=$('#app'),mascot=$('#mascot');
const LV=[{n:'Beginner',age:'2–3',max:10,opt:2},{n:'Nursery 1',age:'3–4',max:20,opt:3},{n:'Nursery 2',age:'4–5',max:50,opt:3},{n:'Nursery 3',age:'5–6',max:100,opt:3}];
const BADGES=[[10,'🥉','Bronze Star'],[25,'🥈','Silver Star'],[50,'🥇','Gold Star'],[100,'🏆','Super Genius']];
let S={stars:0,level:null,diff:0,run:0,miss:0,st:{},done:{},badges:[]};
try{Object.assign(S,JSON.parse(localStorage.getItem('lg2')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('lg2',JSON.stringify(S))}catch(e){}};
const showStars=()=>{$('#stars').textContent='⭐ '+S.stars};
showStars();
const mark=k=>{if(!S.done[k]){S.done[k]=1;save()}};
const nopt=()=>Math.min(4,LV[S.level].opt+S.diff);
/* progress + adaptive difficulty: 3 right in a row = harder, 2 wrong in a row = easier */
function rec(sec,ok){
  const t=S.st[sec]||(S.st[sec]={r:0,w:0});
  if(ok){t.r++;S.miss=0;if(++S.run>=3&&S.diff<2){S.diff++;S.run=0}}
  else{t.w++;S.run=0;if(++S.miss>=2&&S.diff>0){S.diff--;S.miss=0}}
  save();
}
function bump(){S.stars++;showStars();const b=BADGES.find(x=>x[0]===S.stars);if(b)S.badges.push(b[0]);save();return b}

/* ---- Voice teacher (prefers Nigerian English, falls back to British) ---- */
let voice=null;
function pickVoice(){
  const v=speechSynthesis.getVoices();
  voice=v.find(x=>/en[-_]NG/i.test(x.lang))||v.find(x=>/en[-_]GB/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null;
}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
let sayT,AC;
/* Sound effects (work even when the phone has no speaking voice) */
function tone(f,t=0,d=.18,type='sine'){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime+t;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(.25,n+.02);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+d+.05)}catch(e){}}

    if(ws.length>1&&ws.every(w=>w===ws[0]))ws=[ws[0]];        /* "apple apple" counts as "apple" */

/* Little Genius: loading screen, then the 3D river start screen */
(function(){
  const boot=document.getElementById('boot'),st=document.getElementById('start');
  if(!boot||!st)return;
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  /* --- boot decorations --- */
  const bt=document.getElementById('bt');
  'Little Genius'.split('').forEach((c,i)=>{const s=document.createElement('span');s.textContent=c;s.style.animationDelay=(i*.09)+'s';bt.appendChild(s)});
  for(let i=0;i<12;i++){const s=document.createElement('i');s.className='bstar';s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*70}%;animation-delay:-${Math.random()*3}s;width:${3+Math.random()*5}px;height:${3+Math.random()*5}px`;boot.appendChild(s)}
  /* --- start-screen decorations (static, cheap) --- */
  const stars=document.getElementById('stars');
  for(let i=0;i<16;i++){const e=document.createElement('i');e.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%`;if(i<6){e.className='t';e.style.animationDelay='-'+Math.random()*3+'s'}stars.appendChild(e)}
  /* low-end phones get a lighter scene */
  if((navigator.hardwareConcurrency||4)<=4||(navigator.deviceMemory||4)<=2)st.classList.add('lite');
  /* size the ship to the screen (once, no per-frame work) */
  function fit(){const w=Math.min(innerWidth*.78,innerHeight*.4,400);st.style.setProperty('--sw',w+'px');st.style.setProperty('--shipy',(innerHeight*.76-w*.926)+'px')}
  fit();addEventListener('resize',fit);
  st.addEventListener('click',()=>{document.body.classList.remove('pre');const t=document.querySelector('meta[name=theme-color]');t&&t.setAttribute('content','#7EC8FF')});
  st.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();st.click()}});

  /* --- loading: waits for fonts + page + logo, shows at least ~2.6s so the animation is seen --- */
  const msgs=['Raising the sails…','Filling the river…','Packing the letters…','Counting the stars…','Almost there…'];
  const fill=document.getElementById('bfill'),boat=document.getElementById('bboat'),pct=document.getElementById('bpct'),msg=document.getElementById('bmsg');
  const t0=performance.now(),MIN=2600,MAX=7000;
  let ready=0,p=0,fin=false,tw=0,lp=-1,lm=-1;addEventListener('resize',()=>{tw=0});
  const need=[window.__timeReady,document.fonts&&document.fonts.load&&Promise.all([document.fonts.load('800 1em "Baloo 2"'),document.fonts.load('500 1em "Baloo 2"')]),new Promise(r=>document.readyState==='complete'?r():addEventListener('load',r,{once:true})),(()=>{const im=document.getElementById('slogo');return im.decode?im.decode().catch(()=>{}):Promise.resolve()})()];
  need.forEach(x=>Promise.resolve(x).catch(()=>{}).then(()=>{ready++}));
  setTimeout(()=>{ready=99},MAX);
  function tick(){
    const el=performance.now()-t0,time=Math.min(1,el/MIN);
    const done=ready>=need.length&&el>=MIN;
    const target=done?100:Math.min(92,time*92*(ready>=need.length?1:.85));
    p+=(target-p)*(done?.2:.07);if(done&&p>99.5)p=100;
    fill.style.width=p+'%';
    if(!tw)tw=fill.parentNode.offsetWidth;boat.style.left=Math.max(37,Math.min(tw,tw*p/100))+'px';
    const pr=Math.round(p);if(pr!==lp){lp=pr;pct.textContent=pr+'%'}
    const mi=Math.min(msgs.length-1,Math.floor(p/21));if(mi!==lm){lm=mi;msg.textContent=msgs[mi]}
    if(p>=90&&!st.classList.contains('warm'))st.classList.add('warm');

    requestAnimationFrame(tick);
  }
  function go(){
    setTimeout(()=>{
      st.classList.add('show');
      boot.classList.add('out');
      boot.setAttribute('aria-hidden','true');
      setTimeout(()=>boot.remove(),reduce?300:800);

  }

})();
</script>

  const had=!!navigator.serviceWorker.controller;let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!reloaded){reloaded=true;location.reload()}});
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{r.update();setInterval(()=>r.update(),30*60*1000)}).catch(()=>{}));
}</script>
