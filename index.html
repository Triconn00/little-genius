function about(){document.getElementById('sp').style.transform='scaleX(0)';const ct=[CONTACT.email&&`<a href='mailto:${CONTACT.email}'>${CONTACT.email}</a>`,CONTACT.whatsapp&&`<a href='https://wa.me/${CONTACT.whatsapp}' target='_blank' rel='noopener'>WhatsApp us</a>`].filter(Boolean).join(' \u00b7 ');
A.innerHTML=`<div class='view'><button class='back' data-h=''>\u2190 Home</button><h2 class='pt'>About this app</h2><div class='note' style='--c:var(--c0)'><b>17 Ways to Create Wealth</b> is a practical guide to seventeen small-business money models, written with Nigerian examples. Each model comes with steps, numbers, risks and a 30-day plan.</div><div class='sec2'>What it is for</div><p>Helping beginners compare ways to earn, start small, and track their first 30 days. It is a learning and planning tool.</p><div class='sec2'>What it is not</div><p><b>It is not financial, legal or tax advice.</b> All naira (\u20a6) amounts, timelines and examples are illustrative estimates. The examples are composite stories, not real people. Prices, demand, rules and seasons differ by place. Before you invest, check current prices and any licences or approvals (CAC, NAFDAC, SON and others), and speak with an experienced local operator or an accountant.</p><div class='sec2'>How the numbers are made</div><p>Each model uses one example round with a cost, a revenue and a profit (revenue minus cost). The \u201cwhat if\u201d sliders, the compare table and the profit tools only do simple arithmetic on those numbers.</p><div class='sec2'>Content notes</div><p>The videos are animated explainers, not filmed footage, and have no sound or captions.</p><div class='sec2'>Contact and feedback</div>${contactCard()}<div class='sec2'>Version</div><p>Version 1.1 \u00b7 Content updated November 2026</p>${LINKS}</div>`}
function privacy(){document.getElementById('sp').style.transform='scaleX(0)';
A.innerHTML=`<div class='view pv'><button class='back' data-h=''>\u2190 Home</button><h2 class='pt'>Privacy</h2><div class='note' style='--c:var(--c0)'><b>The short version:</b> your progress, notes and settings stay on your own device. You now create a free account with your name, email or phone, and date of birth. In this version those details are kept on your own device only and are not sent to a server.</div><div class='sec2'>What is saved on your device</div><ul><li>Models you starred, and your weekly and 90-day ticks</li><li>Your notes, your chosen engine, your streak and badges</li><li>Compare picks, caption language and size, theme and accessibility settings</li><li>Whether you have seen the welcome tour</li><li>Marketing forum: your imported contacts, message settings sprint ticks and tips board posts</li></ul><p>This is kept in your browser\u2019s local storage. Clearing your browser data, or the button below, removes it.</p><div class='sec2'>What the app does not do</div><ul><li>It does not send your notes, ticks or quiz answers anywhere</li><li>It has no ads and no analytics of its own</li><li>It does not ask for your location or camera</li><li>Marketing forum: contacts you import stay on this device and are never uploaded. They are only used to open WhatsApp, SMS or email on your phone when you tap send. The phone contact picker, if you use it, asks your permission first</li><li>Fingerprint unlock uses your phone's own sensor. The app never sees or stores your fingerprint</li></ul><div class='sec2'>Sharing</div><p>The share and WhatsApp buttons only send the short message you see, through your own phone or WhatsApp. Nothing is shared unless you tap them.</p><div class='sec2'>Messages to the publisher</div><p>If you use the chat or message form, your text is passed to WhatsApp or your email app only when you tap a send button, and it is then handled by those services under their own policies. The helper bot answers from the app\u2019s own content on your device. A short history of the messages you sent is kept on your device only.</p><div class='sec2'>Hosting</div><p>This page is hosted on claude.ai. Like any website, its host may record ordinary technical information, such as visits, under its own policies. This app adds no tracking of its own.</p><div class='sec2'>Your choices</div><button class='btn' id='pc'>Delete my data on this device</button><p class='mut' style='font-size:13px'>Tapping it twice clears everything and restarts the app.</p><div class='sec2'>Changes</div><p>If this page changes, the update will appear here. Version 1.0 \u00b7 November 2026.</p>${LINKS}</div>`;
let sure=false;document.getElementById('pc').onclick=function(){if(!sure){sure=true;this.textContent='Tap again to confirm';return}['w17','w17f','w17t','w17c','w17z','w17s','w17b','w17k','w17e','w17n','w17m','w17cmp','w17o','w17mk','w17mks','w17mksel','w17mkb','w17dest'].forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});location.hash='';location.reload()}}
function guideX(){document.querySelector('.view').insertAdjacentHTML('beforeend',LINKS);if(!GLO.some(g=>g[0]==='Cash flow'))GLO.push(['Cash flow','Money moving in and out of your business over time.'],['Inventory','The stock or materials you hold before selling.'],['Overhead','Costs you pay even when you sell nothing, such as rent.'],['Pre-order','An order taken, and often part-paid, before you make or buy the goods.']);const g=document.getElementById('gl'),q=document.getElementById('gq');const draw=()=>{const s=q.value.toLowerCase(),L=GLO.filter(x=>(x[0]+' '+x[1]).toLowerCase().includes(s));g.innerHTML=L.length?L.map(x=>`<div class='ac'><button>${x[0]}<u>\u2304</u></button><div>${x[1]}</div></div>`).join(''):"<p class='mut'>No matching terms.</p>";g.querySelectorAll('.ac button').forEach(b=>b.onclick=()=>b.parentElement.classList.toggle('o'))};q.oninput=draw;draw()}
let py=-1,pd=0;const ptr=document.createElement('div');ptr.id='ptr';ptr.textContent='\u2193 Pull to refresh';document.body.appendChild(ptr);
addEventListener('touchstart',e=>{py=scrollY===0?e.touches[0].clientY:-1;pd=0},{passive:true});
addEventListener('touchmove',e=>{if(py<0)return;pd=e.touches[0].clientY-py;if(pd>0&&scrollY===0){ptr.style.opacity=Math.min(1,pd/80);ptr.textContent=pd>80?'\u2191 Release to refresh':'\u2193 Pull to refresh'}},{passive:true});
addEventListener('touchend',()=>{ptr.style.opacity=0;if(py>=0&&pd>80){skel();setTimeout(()=>{route();toast('Refreshed')},300)}py=-1;pd=0});

function cosmos(el){if(!el)return;const c=document.createElement('div');c.className='cos';let h="<div class='cz'></div><div class='gl2'></div>";for(let i=0;i<30;i++){const z=1+Math.random()*2.2;h+=`<i class='st2' style='left:${Math.random()*100}%;top:${Math.random()*100}%;width:${z}px;height:${z}px;animation-delay:-${(Math.random()*3).toFixed(2)}s;animation-duration:${(2+Math.random()*3).toFixed(2)}s'></i>`}h+="<i class='sh' style='left:78%;top:8%;animation-delay:2s'></i><i class='sh' style='left:92%;top:30%;animation-delay:6.5s'></i>";c.innerHTML=h;el.prepend(c)}

function mkPhone(raw,cc){raw=String(raw||'').trim();cc=cc||'234';if(!raw)return'';let p=raw.replace(/[^\d+]/g,'');if(!p)return'';
 if(p[0]==='+')p=p.slice(1).replace(/\+/g,'');else if(p.startsWith('00'))p=p.slice(2);else if(p[0]==='0')p=cc+p.slice(1);else if(cc==='234'&&p.length===10&&/^[789]/.test(p))p=cc+p;else if(!p.startsWith(cc)&&p.length<=10)p=cc+p;

 return p.length>=8&&p.length<=15?p:''}
const MKEM=/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i;

 const ems=line.match(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/gi)||[];let rest=line;ems.forEach(e=>rest=rest.replace(e,' '));
 const phs=(rest.match(/\+?\d[\d\s().-]{6,}\d/g)||[]);phs.forEach(p=>rest=rest.replace(p,' '));
 const name=rest.replace(/[,;:|\t]+/g,' ').replace(/\s+/g,' ').replace(/^[-\s]+|[-\s]+$/g,'').trim();
 const ps=phs.map(p=>mkPhone(p,cc)).filter(Boolean);
 if(ps.length<=1&&ems.length<=1){if(ps[0]||ems[0])out.push({n:name,p:ps[0]||'',e:(ems[0]||'').toLowerCase()})}
 else{const nmax=Math.max(ps.length,ems.length);for(let i=0;i<nmax;i++)out.push({n:nmax===1?name:'',p:ps[i]||'',e:(ems[i]||'').toLowerCase()})}});return out}
function mkCsvRows(text){const rows=[];let row=[],cur='',q=false;text=String(text||'').replace(/^﻿/,'');
 for(let i=0;i<text.length;i++){const ch=text[i];if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}else if(ch==='"')q=true;else if(ch===','||ch===';'||ch==='\t'){row.push(cur);cur=''}else if(ch==='\n'){row.push(cur);rows.push(row);row=[];cur=''}else if(ch!=='\r')cur+=ch}
 if(cur!==''||row.length){row.push(cur);rows.push(row)}return rows.filter(r=>r.some(c=>String(c).trim()))}
function mkParseCsv(text,cc){const rows=mkCsvRows(text);if(!rows.length)return[];const h=rows[0].map(c=>String(c).toLowerCase().trim());
 const hasHead=h.some(c=>/name|phone|mobile|tel|e-?mail/.test(c))&&!h.some(c=>/^\+?\d[\d\s]{6,}$/.test(c));
 if(!hasHead)return mkParseFree(rows.map(r=>r.join(', ')).join('\n'),cc);
 const idx=(re,not)=>h.map((c,i)=>re.test(c)&&!(not&&not.test(c))?i:-1).filter(i=>i>=0);
 const nameI=idx(/name/,/file|nick|phonetic|user|company|org/),phI=idx(/phone|mobile|tel|whatsapp/,/label|type|extension/),emI=idx(/e-?mail/,/label|type/);
 const out=[];rows.slice(1).forEach(r=>{const g=i=>String(r[i]||'').trim();let n=nameI.map(g).filter(Boolean).join(' ');
  if(/^\d+$/.test(n.replace(/\s/g,'')))n='';
  let p='';for(const i of phI){const v=g(i).split(/:::|;/)[0];const x=mkPhone(v,cc);if(x){p=x;break}}
  let e='';for(const i of emI){const m=g(i).match(MKEM);if(m){e=m[0].toLowerCase();break}}

/* ---------- awarding ---------- */
function award(key,pts,label){const u=ACC.cur();if(!u)return false;u.earn=u.earn||{};if(u.earn[key])return false;u.earn[key]=Date.now();u.pts=(u.pts||0)+pts;u.plog=u.plog||[];u.plog.push({k:key,l:label,p:pts,d:Date.now()});ACC.put(u);toast('+'+pts+' point'+(pts>1?'s':'')+' · '+label+' 🎉');return true}
function scan(){try{if(!ACC.cur())return;Object.keys(BDG).forEach(k=>{if(BD.includes(k))award('b_'+k,EP.badge,BDG[k][1]+' badge')});Object.keys(done).forEach(i=>{if(done[i]&&done[i].length>=4)award('fin_'+i,EP.finish,'Finished a 4-week plan')});for(let n=1;n<=Math.floor((ST2.best||0)/7);n++)award('streak_'+n,EP.streak,n*7+'-day streak')}catch(e){}}
const _bd=bd;bd=function(k){_bd.apply(this,arguments);setTimeout(scan,80)};
document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('#ci'))setTimeout(scan,150)});
